<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Quiz Battle</title>
  <link rel="stylesheet" href="style.css" />
  <script src="quiz.js" defer></script>
  <script type="module" src="quiz.js" defer></script>
</head>
<body>
  <div class="arena">
    
    
    <div class="fighter">
      <div id="hero" class="sprite">🧙‍♂️</div>
      <p>You</p>
    </div>
    <div class="quiz-box">
      <h2 id="question">Question goes here</h2>
      <div id="answers" class="answers-grid"></div>
    </div>
    <div class="fighter">
      <div class="hp-bar"><div id="dragon-hp"></div></div>
      <div id="dragon" class="sprite">🐉</div>
      <p>Dragon</p>
    </div>

  </div>

</body>
</html>
